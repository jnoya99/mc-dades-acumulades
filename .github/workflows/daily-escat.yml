name: daily-escat

"on":
  schedule:
    # 21:30 UTC ≈ 23:30 Europe/Madrid in summer (CEST); ≈ 22:30 in winter (CET).
    # See README for DST note.
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: daily-escat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture ESCAT + rebuild panel
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          CLOSE_DATE=$(python -c "from scripts.capture_escat import intended_close_date; print(intended_close_date())")
          echo "ESCAT intended close date (Europe/Madrid): $CLOSE_DATE"
          python scripts/capture_escat.py --force --date "$CLOSE_DATE"

      - name: Capture mountain stations (throttled, all sources)
        run: python scripts/capture_mountain.py --mode daily --force
        # Sequential GETs with 0.4–0.8s delay (~86 stations). Failures are per-station.

      - name: Commit archive + panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily docs/panel.json docs/panel_mountain.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily ESCAT + mountain snapshot [skip ci]"
            git pull --rebase origin main
            git push
          fi
