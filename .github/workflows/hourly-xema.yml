name: hourly-xema

"on":
  schedule:
    # Every hour at minute 35 UTC — offsets ESCAT (:00) and AEMET (:20 every 2 h)
    # so the three data pushes do not rebase into each other.
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-xema
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture XEMA hourly + rebuild hourly_*_xema.json
        run: python scripts/capture_xema_hourly.py --days 3 --force
        # Each run rewrites the last 3 Madrid days (covers the ~2-day official
        # daily lag plus today). Raw files outside that window stay until the
        # 14-day prune. No API key: Socrata nzvn-apee is public.

      - name: Commit archive + hourly panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/hourly_rain_xema.json docs/hourly_meteo_xema.json
          git status --porcelain -- data/hourly | while read -r line; do
            f=$(printf '%s' "$line" | cut -c4-)
            case "$f" in
              data/hourly/XEMA_*) git add -A -- "$f" ;;
            esac
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git status --short
            git commit -m "data: hourly XEMA panel [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
